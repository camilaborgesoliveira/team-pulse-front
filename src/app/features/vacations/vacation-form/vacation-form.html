<section class="vacation-form">

  <h2>Cadastrar Férias</h2>

  <form (ngSubmit)="saveVacation()">

    <div class="form-group">
      <label for="employeeName">Colaborador</label>

      <input
        type="text"
        id="employeeName"
        name="employeeName"
        [(ngModel)]="employeeName"
        placeholder="Digite o nome do colaborador"
      >
    </div>

    <div class="form-group">
      <label for="startDate">Início das férias</label>

      <input
        type="date"
        id="startDate"
        name="startDate"
        [(ngModel)]="startDate"
      >
    </div>

    <div class="form-group">
      <label for="endDate">Fim das férias</label>

      <input
        type="date"
        id="endDate"
        name="endDate"
        [(ngModel)]="endDate"
      >
    </div>

    <div class="form-group">
      <label for="returnDate">Data de retorno</label>

      <input
        type="date"
        id="returnDate"
        name="returnDate"
        [(ngModel)]="returnDate"
      >
    </div>

    <button type="submit">
      Salvar férias
    </button>

  </form>

</section>
