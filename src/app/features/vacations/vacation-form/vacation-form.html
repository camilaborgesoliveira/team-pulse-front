<section class="vacation-form-page">

  <div class="page-header">
    <div>
      <span class="eyebrow">FÉRIAS</span>
      <h1>Nova solicitação de férias</h1>
      <p>Defina o período de férias do colaborador.</p>
    </div>
  </div>

  <div class="vacation-card">

    <div class="form-group">
      <label for="employee">Colaborador</label>

      <input
        id="employee"
        type="text"
        [(ngModel)]="employeeName"
        placeholder="Digite o nome do colaborador"
      />
    </div>

    <div class="form-group">
      <label for="startDate">Data de início</label>

      <input
        id="startDate"
        type="date"
        [(ngModel)]="startDate"
        (change)="calculateDates()"
      />
    </div>

    <div class="form-group">
      <label>Quantidade de dias</label>

      <div class="days-options">

        <button
          type="button"
          [class.active]="vacationDays === 10"
          (click)="selectDays(10)"
        >
          10 dias
        </button>

        <button
          type="button"
          [class.active]="vacationDays === 15"
          (click)="selectDays(15)"
        >
          15 dias
        </button>

        <button
          type="button"
          [class.active]="vacationDays === 20"
          (click)="selectDays(20)"
        >
          20 dias
        </button>

        <button
          type="button"
          [class.active]="vacationDays === 30"
          (click)="selectDays(30)"
        >
          30 dias
        </button>

      </div>
    </div>

    <div class="form-group">
      <label for="customDays">Outra quantidade de dias</label>

      <input
        id="customDays"
        type="number"
        min="1"
        [(ngModel)]="vacationDays"
        (input)="calculateDates()"
        placeholder="Digite a quantidade"
      />
    </div>

    <div class="result-container">

      <div class="result-card">
        <span>FINAL DAS FÉRIAS</span>
        <strong>
          {{ finalDate || '--/--/----' }}
        </strong>
      </div>

      <div class="result-card">
        <span>RETORNO AO TRABALHO</span>
        <strong class="return-date">
          {{ returnDate || '--/--/----' }}
        </strong>
      </div>

    </div>

    <div class="actions">

      <button
        type="button"
        class="cancel-button"
      >
        Cancelar
      </button>

      <button
        type="button"
        class="save-button"
        (click)="saveVacation()"
      >
        Salvar férias
      </button>

    </div>

  </div>

</section>
