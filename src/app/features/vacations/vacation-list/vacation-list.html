<section class="vacation-list">

  <h2>Férias da Equipe</h2>

  <table>

    <thead>
    <tr>
      <th>Colaborador</th>
      <th>Início das férias</th>
      <th>Retorno</th>
    </tr>
    </thead>

    <tbody>

    <tr *ngFor="let vacation of vacations">
      <td>{{ vacation.employeeName }}</td>
      <td>{{ vacation.startDate }}</td>
      <td>{{ vacation.endDate }}</td>
    </tr>

    </tbody>

  </table>

</section>
