<div class="app-layout">

  <!-- MENU LATERAL -->
  <aside class="sidebar">

    <!-- LOGO -->
    <div class="brand">

      <div class="brand-icon">
        ✦
      </div>

      <div class="brand-text">
        <span>TEAM</span>
        <strong>Pulse</strong>
      </div>

    </div>


    <!-- MENU -->
    <nav class="menu">

      <span class="menu-title">
        GESTÃO
      </span>


      <!-- FÉRIAS -->
      <div class="menu-group">

        <div class="menu-parent">
          🌴 <span>Férias</span>
        </div>

        <div class="submenu">

          <a
            routerLink="/vacations"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }">

            📋 Lista de férias

          </a>

          <a
            routerLink="/vacations/new"
            routerLinkActive="active">

            ➕ Nova férias

          </a>

        </div>

      </div>


      <!-- AUSÊNCIAS -->
      <div class="menu-group">

        <div class="menu-parent">
          📅 <span>Ausências</span>
        </div>

        <div class="submenu">

          <a
            routerLink="/time-off"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }">

            📋 Lista de ausências

          </a>

          <a
            routerLink="/time-off/new"
            routerLinkActive="active">

            ➕ Nova ausência

          </a>

        </div>

      </div>


      <!-- FEEDBACKS -->
      <div class="menu-group">

        <div class="menu-parent">
          💬 <span>Feedbacks</span>
        </div>

        <div class="submenu">

          <a
            routerLink="/feedback"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }">

            📋 Lista de feedbacks

          </a>

          <a
            routerLink="/feedback/new"
            routerLinkActive="active">

            ➕ Novo feedback

          </a>

        </div>

      </div>

    </nav>


    <!-- STATUS -->
    <div class="sidebar-footer">

      <span class="status-dot"></span>

      Sistema online

    </div>

  </aside>


  <!-- CONTEÚDO PRINCIPAL -->
  <main class="content">

    <router-outlet></router-outlet>

  </main>

</div>
